# CMS Open Payments bulk sources — June 2026 publication (P06302026_06032026).
#
# Current years (2019-2025): per-file CSVs discovered via
#   https://openpaymentsdata.cms.gov/api/1/metastore/schemas/dataset/items
# Archived years (2013-2018): frozen ZIPs from the Archived Datasets page
#   https://openpaymentsdata.cms.gov/datasets/archived
#   (each year froze at its final January publication; note the 2013-2016
#   2-digit/.ZIP vs 2017-2018 4-digit/.zip naming; the archived page links a
#   stale Jan-2025 URL for PY2018 — we use the final Jan-2026 file)
# Deleted-records files exist per year from PY2016 onward only; PY2013-2015
# never had them (verified against the ZIP central directories). PY2025 has
# none yet (first publication).
# Methodology & data dictionary:
#   https://www.cms.gov/OpenPayments/Downloads/OpenPaymentsDataDictionary.pdf

